# ===================================================================
# Core Spring Boot Settings
# ===================================================================
server:
  port: 8080 # Default HTTP port

# ===================================================================
# Database (PostgreSQL) Configuration
# ===================================================================
spring:
  datasource:
    # Эти значения будут переопределены переменными окружения из docker-compose.yaml для сервиса app
    # или из Kubernetes manifests. Значения по умолчанию для локального запуска без Docker, если БД на localhost.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/chatverse}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgre}
    driver-class-name: org.postgresql.Driver

  # ===================================================================
  # JPA / Hibernate Configuration
  # ===================================================================
  jpa:
    hibernate:
      ddl-auto: update # Strategy for DB schema management
    show-sql: true # Show SQL statements in logs
    properties:
      hibernate:
        format_sql: true # Format SQL statements
    defer-datasource-initialization: true # Defer DataSource initialization

  # ===================================================================
  # Redis Configuration
  # ===================================================================
  data:
    redis:
      # Значения по умолчанию для Docker-окружения.
      # Могут быть переопределены переменными окружения, если необходимо.
      host: ${SPRING_DATA_REDIS_HOST:redis} # Hostname of the Redis service
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # password: ${SPRING_DATA_REDIS_PASSWORD:} # Uncomment and set if your Redis requires a password
    lettuce:
      pool:
        max-active: 8   # Максимальное количество активных соединений
        max-idle: 8     # Максимальное количество "простаивающих" соединений
        min-idle: 0     # Минимальное количество "простаивающих" соединений
        max-wait: -1ms  # Максимальное время ожидания соединения (отрицательное значение - без ограничения)
  cache:
    type: redis
    redis:
      time-to-live.users: 3600000 # 1 час для кэша "users" (в миллисекундах)
      time-to-live.messages: 600000 # 10 минут для кэша "messages"

  # ===================================================================
  # Kafka Configuration
  # ===================================================================
  kafka:
    # Используем переменную окружения.
    # Значение по умолчанию 'kafka:29092' подходит для docker-compose, где приложение и kafka в одной сети.
    # Для Kubernetes это будет 'kafka-0.kafka.chatverse.svc.cluster.local:9092' или аналогичное.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false # Don't add Java type headers to JSON
    consumer:
      # Используем переменную окружения.
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:chatverse-app-group} # Consumer group ID
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              # Доверяем всему пакету dto и его подпакетам, если DTO для Kafka могут быть в разных подпакетах
              packages: com.example.chatverse.application.dto.*
            value:
              default:
                type: com.example.chatverse.application.dto.message.ChatMessage # Default type for JSON deserialization
            use:
              type:
                headers: false # Don't require type headers if default.type is set
      auto-offset-reset: earliest # Start reading from the earliest offset if no offset is stored

  # ===================================================================
  # Flyway Configuration (Uncomment if you decide to use Flyway)
  # ===================================================================
  # flyway:
  #   enabled: true
  #   baseline-on-migrate: true # Creates baseline if no metadata table exists
  #   url: ${spring.datasource.url} # Use the same datasource URL
  #   user: ${spring.datasource.username} # Use the same datasource username
  #   password: ${spring.datasource.password} # Use the same datasource password
  #   locations: classpath:db/migration # Location of your SQL migration scripts
  #   baseline-version: 1 # Version to start with if baselining
  #   baseline-description: Initial_Setup # Description for the baseline

# ===================================================================
# Actuator Configuration
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # Expose specific actuator endpoints
  endpoint:
    health:
      show-details: always # Show full details in /health
      # group: # Configure health groups (optional)
      #   liveness:
      #     include: livenessState,diskSpace # Add kafka here if needed explicitly
      #   readiness:
      #     include: readinessState,db,redis,kafka

# ===================================================================
# Swagger / SpringDoc OpenAPI Configuration
# ===================================================================
springdoc:
  swagger-ui:
    enabled: true # Enable Swagger UI
    servers:
      # Используем переменную окружения.
      # Значение по умолчанию 'http://localhost:8080' подходит для локального запуска приложения.
      # Для Kubernetes/Ingress это будет 'http://chatverse.local:8888' или 'https://chatverse.local'.
      - url: ${SWAGGER_SERVER_URL:http://localhost:8080}

# ===================================================================
# Logging Configuration
# ===================================================================
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.hibernate: ERROR # Reduce Hibernate noise
    com.example.chatverse: DEBUG # Your application's base package
    org.apache.kafka.clients: INFO
    org.springframework.kafka: INFO
    # io.lettuce.core: DEBUG
    # org.springframework.data.redis: DEBUG