apiVersion: v1
kind: Service
metadata:
  name: chatverse-app
  namespace: chatverse
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  selector:
    app: chatverse-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatverse-app
  namespace: chatverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatverse-app
  template:
    metadata:
      labels:
        app: chatverse-app
    spec:
      containers:
        - name: chatverse-app
          image: ${IMAGE_NAME}  # Заменится при деплое через deploy.sh
          imagePullPolicy: IfNotPresent  # Важно для локальных образов
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/chatverse
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgre
            - name: SPRING_REDIS_HOST
              value: redis
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -Djava.security.egd=file:/dev/./urandom"  # Добавлен security.egd
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"  # Добавлен явный профиль
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90  # Увеличен для Raspberry Pi
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 45  # Увеличен для Raspberry Pi
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:  # Добавлен startupProbe для медленного старта
            httpGet:
              path: /actuator/health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
      restartPolicy: Always  # Явное указание политики
      terminationGracePeriodSeconds: 30  # Время на graceful shutdown