apiVersion: v1
kind: Service
metadata:
  name: chatverse-app
  namespace: chatverse
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  selector:
    app: chatverse-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatverse-app
  namespace: chatverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatverse-app
  template:
    metadata:
      labels:
        app: chatverse-app
    spec:
      containers:
        - name: chatverse-app
          image: ${IMAGE_NAME}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/chatverse
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgre
            - name: SPRING_REDIS_HOST
              value: redis
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5