apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatverse-ingress
  namespace: chatverse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: chatverse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatverse-app
                port:
                  number: 8080