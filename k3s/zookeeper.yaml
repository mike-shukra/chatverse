apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: chatverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: bitnami/zookeeper:3.8.2-debian-11-r0
          ports:
            - containerPort: 2181
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"